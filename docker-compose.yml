services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CLAIMCHECK_DATABASE_URL: /app/data/claimcheck.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
